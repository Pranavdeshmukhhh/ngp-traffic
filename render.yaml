services:
  - type: web
    name: ngp-traffic
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TOMTOM_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
